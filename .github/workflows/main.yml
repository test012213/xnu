name: xnu-build-pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SDKROOT: /Applications/Xcode_16.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.2.sdk
      RC_DARWIN_KERNEL_VERSION: "26.0"
      ARCH_CONFIGS: X86_64
      KERNEL_CONFIGS: DEVELOPMENT
      LC_ALL: C
      LANG: C

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force Xcode select
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew update
          brew install make bash coreutils

      - name: Verify environment
        run: |
          brew install cmatrix

      - name: Prepare XNU build tree sanity check
        run: |
          ls -la
          cmatrix
