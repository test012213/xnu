name: xnu-build-pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SDKROOT: /Applications/Xcode_16.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.2.sdk
      RC_DARWIN_KERNEL_VERSION: "26.0"
      ARCH_CONFIGS: X86_64
      KERNEL_CONFIGS: DEVELOPMENT
      LC_ALL: C
      LANG: C

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force Xcode select
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew update
          brew install make bash coreutils

      - name: Verify environment
        run: |
          echo "SDKROOT=$SDKROOT"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          uname -a
          which make
          make --version

      - name: Prepare XNU build tree sanity check
        run: |
          ls -la
          test -d xnu || echo "WARNING: xnu folder missing"
          find . -maxdepth 2 -type f -name "Makefile"

      - name: Initialize submodules (safe fallback)
        run: |
          git submodule sync || true
          git submodule update --init --recursive || true

      - name: Build XNU (core)
        working-directory: xnu
        run: |
          set -euo pipefail

          echo "Starting XNU build..."
          echo "RC_DARWIN_KERNEL_VERSION=$RC_DARWIN_KERNEL_VERSION"

          # Clean stale artifacts
          rm -rf BUILD || true

          # Main build
          make \
            -j$(sysctl -n hw.ncpu) \
            RC_DARWIN_KERNEL_VERSION="$RC_DARWIN_KERNEL_VERSION" \
            SDKROOT="$SDKROOT" \
            ARCH_CONFIGS="$ARCH_CONFIGS" \
            KERNEL_CONFIGS="$KERNEL_CONFIGS" \
            all 2>&1 | tee build.log

      - name: Collect artifacts safely
        if: always()
        working-directory: xnu
        run: |
          set -euo pipefail

          mkdir -p ../artifacts

          echo "Scanning outputs..."
          find . -type f \( \
            -name "kernel.development" -o \
            -name "kernel.release" -o \
            -name "kernel.debug" -o \
            -name "*.log" \
          \) -print0 | while IFS= read -r -d '' f; do
            cp "$f" ../artifacts/ || true
          done

          cd ../artifacts || true
          if ls | grep -q .; then
            shasum -a 256 * > SHA256SUMS.txt || true
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-artifacts
          path: artifacts/

      - name: Upload full logs (debug fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-failure-logs
          path: |
            xnu/build.log
            xnu/**/*.log
