name: Build XNU

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      RC_DARWIN_KERNEL_VERSION: "26.0"
      SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Say hi, for no reason ✌️🥹
        run: echo hi vrochacho, hope this works twin.

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify toolchain
        run: |
          xcodebuild -version
          clang --version
          make --version

      - name: Build XNU (bootstrap only)
        run: |
          cd xnu
          unset MAKEFLAGS
          make clean || true
          make -j$(sysctl -n hw.ncpu) \
            RC_DARWIN_KERNEL_VERSION=${RC_DARWIN_KERNEL_VERSION} \
            SDKROOT=${SDKROOT} \
            ARCH_CONFIGS=X86_64 \
            KERNEL_CONFIGS=DEVELOPMENT
